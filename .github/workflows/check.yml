name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
            arch: X64
          - os: macos-15
            platform: macos-arm64
            arch: ARM64
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify runner architecture
        shell: bash
        run: test "$RUNNER_ARCH" = "${{ matrix.arch }}"
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential jq util-linux procps
      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: command -v jq >/dev/null || brew install jq
      - name: Install locked tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.18
          install_args: --locked go just golangci-lint
      - name: Verify toolchain
        run: |
          mise exec -- go version
          mise exec -- just --version
          mise exec -- golangci-lint version
          git diff --exit-code -- mise.toml mise.lock
      - name: Run all checks
        run: mise exec -- just check
